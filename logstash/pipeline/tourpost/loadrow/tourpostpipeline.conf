input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.3.1.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://host.docker.internal:5432/meta_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    statement => "select distinct tp.mapx, tp.mapy, tp.common_place_id, tp.content_id, tp.create_date, tp.addr1, tp.area_code, tp.cat1, tp.cat2, tp.cat3, tp.content_type_id, tp.first_image, tp.homepage, tp.language, tp.overview, tp.title , coalesce(count(distinct r.id),0) as review_count, coalesce(avg(distinct r.rating),0) as rating_average from tour_post tp left join review_tour_post rtp on tp.content_id = rtp.tour_post_id left join review r on r.id = rtp.review_id where content_id > :sql_last_value group by tp.common_place_id, tp.content_id order by tp.content_id ASC"
    schedule =>  "*/2 * * * *"
    sql_log_level => "debug"
    tracking_column => "content_id"
    use_column_value => true
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/tourpost_last_run_metadata"
  }
}
filter {
  mutate {
    convert => {"%{mapy}" => "float"}
    convert => {"%{mapx}" => "float"}
    convert => { "rating_average" => "float" }
  }
  mutate {
    add_field => { "[location][lat]" => "%{mapy}" }
    add_field => { "[location][lon]" => "%{mapx}" }
  }
  mutate {
    remove_field => ["@version", "jdbc_connection_string", "jdbc_user", "jdbc_password", "mapx", "mapy","sigungucode", "homepage", "cpyrht_div_cd"]
  }
  mutate {
    convert => {"[location][lat]" => "float"}
    convert => {"[location][lon]" => "float"}
  }
    ruby{
      code => "
        event.set('[location]', { 'lat' => event.get('[location][lat]'), 'lon' => event.get('[location][lon]') })
        event.set('rating_average', (event.get('rating_average') * 10).floor / 10.0)
      "
    }
}
output {
if [language] == "KO"{
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "tourpostkor"
    document_id => "%{content_id}"
    manage_template => true
    template_name => "tourpostkortemplate"
    template => "/usr/share/logstash/template/TourPostKoreanTemplate.json"
    template_overwrite => true
  }
}
